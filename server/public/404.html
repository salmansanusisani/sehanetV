<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — SehaNet</title>
  <style>
    :root {
      --teal: #0F6D61;
      --teal-deep: #0A2E2B;
      --cream: #F7F3EA;
      --ink: #08211E;
      --muted: #64748B;
      --gold: #E8A63B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
      padding: 24px;
      text-align: center;
    }
    .box { max-width: 420px; }
    .logo {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--teal-deep); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.3rem;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 4rem; margin: 0; line-height: 1;
      color: var(--teal-deep); letter-spacing: -0.02em;
    }
    h1 span { color: var(--gold); }
    h2 { font-size: 1.15rem; margin: 10px 0 8px; color: var(--teal-deep); }
    p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a.btn {
      display: inline-block;
      background: var(--teal-deep); color: #fff;
      text-decoration: none;
      padding: 12px 28px; border-radius: 999px;
      font-weight: 600; font-size: 0.9rem;
      transition: opacity 0.15s ease;
    }
    a.btn:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">SN</div>
    <h1>4<span>0</span>4</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <a class="btn" href="/">Back to SehaNet</a>
  </div>
</body>
</html>
