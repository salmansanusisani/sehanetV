<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SehaNet</title>
<link rel="icon" href="s.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/driver.js/dist/driver.js.iife.js"></script>
<link rel="stylesheet" href="https://unpkg.com/driver.js/dist/driver.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toast notifications (session warnings, errors, successes) -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Mobile screen container wrapper -->
  <div class="mobile-wrapper">
    <!-- Login screen -->
    <div id="loginScreen" class="login-screen">
      <div class="login-card" id="loginCard">
        <div class="login-brand">
          <div class="login-brand-mark"><img src="s.png" alt="SehaNet" /></div>
          <div>
            <div class="login-title">SehaNet</div>
            <div class="login-subtitle">Health plan partner portal</div>
          </div>
        </div>
        <form id="loginForm" autocomplete="off">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" autocomplete="username" placeholder="Enter your username" />
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" />
          <div id="loginError" class="error-text"></div>
          <button id="loginBtn" class="login-submit" type="button">Log in</button>
        </form>
        <button id="showRegisterBtn" class="login-link-btn" type="button">New customer? Create an account</button>
      </div>

      <div id="registerCard" class="login-card hidden">
        <div class="login-brand">
          <div class="login-brand-mark"><img src="s.png" alt="SehaNet" /></div>
          <div>
            <div class="login-title">Create your account</div>
            <div class="login-subtitle">Manage your SehaNet plan online.</div>
          </div>
        </div>
        <form id="registerForm" autocomplete="off">
          <div class="grid-2">
            <div><label>Full name</label><input id="reg-fullName" autocomplete="name" placeholder="e.g. Ada Obi" /></div>
            <div><label>Phone number</label><input id="reg-phone" autocomplete="tel" placeholder="2348123456789" /></div>
          </div>
          <label>Email address</label><input id="reg-email" type="email" autocomplete="email" placeholder="you@email.com" />
          <label>Location</label><input id="reg-location" placeholder="e.g. Lagos, Nigeria" />
          <div class="grid-2">
            <div>
              <label>Date of birth</label><input id="reg-dob" type="date" />
            </div>
            <div>
              <label>Gender</label>
              <select id="reg-gender"><option value="">Select gender</option><option>Male</option><option>Female</option></select>
            </div>
          </div>
          <label>Choose username</label><input id="reg-username" autocomplete="username" placeholder="Pick a username" />
          <label>Create password</label><input id="reg-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
          <div id="registerError" class="error-text"></div>
          <button id="registerBtn" class="login-submit" type="button">Create account</button>
        </form>
        <button id="showLoginBtn" class="login-link-btn" type="button">Back to log in</button>
      </div>
    </div>

    <!-- Main app -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuToggle" class="ghost-btn menu-toggle-btn" aria-label="Open menu" aria-expanded="false">
            <i data-lucide="menu" style="width:18px;height:18px;"></i>
          </button>
          <div class="topbar-brand">
            <div class="brand-mark"><img src="s.png" alt="SehaNet" /></div>
            <div>
              <div class="topbar-eyebrow">SEHANET</div>
              <div class="topbar-title" id="userLabel"></div>
            </div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="settings-dropdown-wrap">
            <button id="headerSettingsBtn" class="ghost-btn icon-btn" title="Settings & Options" aria-label="Settings">
              <i data-lucide="settings" style="width:18px;height:18px;"></i>
            </button>
            <div id="settingsDropdown" class="settings-dropdown hidden">
              <div class="dropdown-header">
                <div class="dropdown-title">Settings &amp; Options</div>
              </div>
              
              <!-- Theme Selector -->
              <div class="dropdown-section">
                <div class="dropdown-label">Theme Mode</div>
                <div class="theme-toggle-row">
                  <button type="button" class="theme-option-btn" id="themeBtnLight" data-theme="light"><i data-lucide="sun" style="width:14px;height:14px;"></i> Light</button>
                  <button type="button" class="theme-option-btn" id="themeBtnDark" data-theme="dark"><i data-lucide="moon" style="width:14px;height:14px;"></i> Dark</button>
                </div>
              </div>

              <div class="dropdown-divider"></div>

              <!-- Retake Tour -->
              <button id="retakeTourBtn" class="dropdown-item" type="button">
                <i data-lucide="help-circle" style="width:16px;height:16px;"></i> <span>Retake Tour</span>
              </button>

              <!-- Change Password -->
              <button id="changePasswordBtn" class="dropdown-item" type="button">
                <i data-lucide="key" style="width:16px;height:16px;"></i> <span>Change Password</span>
              </button>

              <div class="dropdown-divider"></div>

              <!-- Log Out -->
              <button id="logoutBtn" class="dropdown-item danger" type="button">
                <i data-lucide="log-out" style="width:16px;height:16px;"></i> <span>Log Out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="navOverlay" class="nav-overlay"></div>
      <nav class="tabs" id="tabs"></nav>

      <main id="views" class="views"></main>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="card hidden modal-card">
      <div class="modal-header">
        <h2>Change Password</h2>
        <button id="pwd-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="grid">
        <input id="pwd-current" type="password" placeholder="Current Password" autocomplete="current-password" />
        <input id="pwd-new" type="password" placeholder="New Password (min 6 chars)" autocomplete="new-password" />
        <input id="pwd-confirm" type="password" placeholder="Confirm New Password" autocomplete="new-password" />
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="primary" id="pwd-submit">Update Password</button>
        <button class="subtle" id="pwd-cancel">Cancel</button>
      </div>
      <div id="pwd-output" style="margin-top:8px;"></div>
    </div>

    <footer class="site-footer">
      © SehaNet 2026 · Contact developer: <a href="mailto:salmansanusi90@gmail.com">salmansanusi90@gmail.com</a> · Contact admin: <a href="tel:07075664676">07075664676</a>
    </footer>
  </div>


  <script src="app.js"></script>
</body>
</html>
